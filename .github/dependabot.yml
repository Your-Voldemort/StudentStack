# Dependabot Configuration
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    groups:
      dev-dependencies:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'typescript*'
          - 'vitest*'
          - '@playwright/*'
          - '@testing-library/*'
          - '@vitest/*'
        update-types:
          - 'minor'
          - 'patch'
      nextjs:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
        update-types:
          - 'patch'
      supabase:
        patterns:
          - '@supabase/*'
        update-types:
          - 'minor'
          - 'patch'
      drizzle:
        patterns:
          - 'drizzle*'
        update-types:
          - 'minor'
          - 'patch'
      tailwind:
        patterns:
          - 'tailwind*'
          - '@tailwindcss/*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'