# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action

# Fail on vulnerabilities with severity >= high
fail-on-severity: high

# Allow specific licenses
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - CC0-1.0
  - Unlicense

# Deny specific licenses
deny-licenses:
  - GPL-2.0
  - GPL-3.0
  - AGPL-3.0
  - LGPL-2.1
  - LGPL-3.0

# Deny specific packages (optional)
# deny-packages:
#   - package-name@version

# Allow specific scopes for vulnerabilities (optional)
# allow-vulnerabilities:
#   - GHSA-xxxx-xxxx-xxxx

# Configuration for allowed changes
# allow-same-version: true
# allow-patch-version: true